# Render Blueprint for the Yuragi-Strider FastAPI backend.
# Deploy: Render dashboard -> New -> Blueprint -> point at this repo.
#
# NOTE: this project's live service (quantsim-vjul) was created via
# "New Web Service" rather than this Blueprint, so Render does not apply
# this file automatically — ALLOWED_ORIGINS and PUBLIC_MAX_LOGICAL_QUBITS
# must be set by hand under the service's Environment tab in the Render
# dashboard. This file documents the intended values and is what a fresh
# Blueprint-based deploy would use.
services:
  - type: web
    name: yuragi-strider-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      # Setting ALLOWED_ORIGINS also marks this as a public, split-origin
      # deploy, which withholds raw exception text from 5xx bodies. Set
      # EXPOSE_INTERNAL_ERRORS=1 to override that while debugging.
      - key: ALLOWED_ORIGINS
        value: https://yuragi-strider-app.23sam55781.workers.dev
      - key: PUBLIC_MAX_LOGICAL_QUBITS
        value: "8"
      # The attack simulator stays unmounted unless all three are set (see
      # docs_for_develop/deployment/web-demo.md section 6). It keeps state in
      # one process, so never raise WEB_CONCURRENCY above 1.
      # - key: ATTACK_SIMULATOR_PROFILE
      #   value: public
      # - key: ATTACK_SIMULATOR_ALLOWED_ORIGINS
      #   value: https://yuragi-strider-app.23sam55781.workers.dev
      # - key: ATTACK_SIMULATOR_ALLOWED_HOSTS
      #   value: quantsim-vjul.onrender.com,yuragi-strider-app.23sam55781.workers.dev
    healthCheckPath: /api/health
