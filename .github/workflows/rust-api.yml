name: Rust API

on:
  pull_request:
    paths:
      - "Dockerfile.rust-api"
      - ".dockerignore"
      - "rust_kernels/yuragi_strider_api/**"
      - ".github/workflows/rust-api.yml"
  push:
    branches:
      - master
    paths:
      - "Dockerfile.rust-api"
      - ".dockerignore"
      - "rust_kernels/yuragi_strider_api/**"
      - ".github/workflows/rust-api.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path rust_kernels/yuragi_strider_api/Cargo.toml -- --check
      - name: Test Rust API
        run: cargo test --manifest-path rust_kernels/yuragi_strider_api/Cargo.toml
      - name: Capture resolved lockfile for repository update
        run: |
          printf 'LOCKFILE_BASE64_BEGIN\n'
          base64 --wrap=0 rust_kernels/yuragi_strider_api/Cargo.lock
          printf '\nLOCKFILE_BASE64_END\n'
      - name: Build production image
        run: docker build --file Dockerfile.rust-api --tag yuragi-strider-rust-api:test .
