[package]
name = "yuragi_strider_api"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "yuragi-strider-api"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
serde_json = "1.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "net"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors"] }
